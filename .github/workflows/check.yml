name: Check and build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  application:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: uv sync --locked
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: uv run ruff check src tests clients frontend/tests
      - run: uv run pytest -q
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
        if: runner.os == 'Linux'
      - run: npm run test:e2e
        working-directory: frontend
        if: runner.os == 'Linux'
      - run: node --check clients/android/report.js
      - run: uv run python clients/linux/report.py --help
        if: runner.os == 'Linux'
      - run: uv run --no-project --with winrt-windows-media-control python -c "from winrt.windows.media.control import GlobalSystemMediaTransportControlsSessionManager"
        if: runner.os == 'Windows'
      - run: uv run python clients/windows/report.py --help
        if: runner.os == 'Windows'
